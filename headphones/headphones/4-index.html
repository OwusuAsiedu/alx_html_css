<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphones Website</title>
    <link rel="stylesheet" href="4-styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Headphones</h1>
    </header>

    <!-- Main content sections -->
    <main>
        <section class="hero">
            <h2>Experience Pure Sound</h2>
        </section>

        <section class="what-we-do">
            <h2>What We Do</h2>
            <p>We create immersive sound experiences that inspire creativity.</p>
        </section>

        <section class="our-results">
            <h2>Our Results</h2>
            <p>Thousands of happy customers worldwide!</p>
        </section>

        <section class="contact">
            <h2>Contact Us</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="footer-icons">
                <a href="#" class="icon facebook">f</a>
                <a href="#" class="icon twitter">t</a>
                <a href="#" class="icon instagram">i</a>
            </div>
            <p>&copy; 2025 Headphones. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
